
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Track your money. Manage it better.</p>
        </header>

        <section class="balance-card">
            <p>Total Balance</p>
            <h2 id="balance">₹0.00</h2>
        </section>

        <section class="summary">
            <div class="summary-card income">
                <p>Total Income</p>
                <h3 id="income">₹0.00</h3>
            </div>

            <div class="summary-card expense">
                <p>Total Expenses</p>
                <h3 id="expense">₹0.00</h3>
            </div>
        </section>

        <section class="form-card">
            <h2>Add Transaction</h2>

            <form id="transaction-form">
                <label for="description">Description</label>
                <input type="text" id="description"
                       placeholder="e.g. Food, Salary" required>

                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount"
                       placeholder="Enter amount" min="0.01"
                       step="0.01" required>

                <label for="type">Transaction Type</label>
                <select id="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" required>

                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section class="history-card">
            <h2>Transaction History</h2>
            <ul id="transaction-list"></ul>
            <p id="empty-message">No transactions yet. Add one above!</p>
        </section>

        <footer>
            <p>Expense Tracker | Built with HTML, CSS & JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
